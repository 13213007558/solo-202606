<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市街景3D转换器</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="app">
        <div id="viewport-container">
            <canvas id="three-canvas"></canvas>
        </div>
        <div id="upload-overlay" class="overlay">
            <div class="upload-content">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <h1 class="upload-title">城市街景3D转换器</h1>
                <p class="upload-desc">上传一张城市街景照片，自动转换为3D场景</p>
                <input type="file" id="file-input" accept="image/*" hidden>
                <button id="upload-button" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    选择图片上传
                </button>
            </div>
        </div>
        <div id="view-preset-buttons" class="hidden">
            <button class="view-btn" data-view="birdseye" title="鸟瞰视角">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                    <polyline points="2 17 12 22 22 17"/>
                    <polyline points="2 12 12 17 22 12"/>
                </svg>
                <span>鸟瞰</span>
            </button>
            <button class="view-btn" data-view="street" title="街道平视">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
                <span>街道平视</span>
            </button>
            <button class="view-btn" data-view="panoramic" title="全景环绕">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                </svg>
                <span>全景环绕</span>
            </button>
        </div>
        <div id="info-panel" class="hidden">
            <button id="close-info-btn" class="close-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div class="info-content">
                <img id="building-thumbnail" src="" alt="建筑缩略图"/>
                <div class="info-item">
                    <label>色调值</label>
                    <span id="hue-value">0°</span>
                </div>
                <div class="info-item">
                    <label>亮度值</label>
                    <span id="brightness-value">0%</span>
                </div>
                <div class="info-item">
                    <label>颜色样本</label>
                    <div id="color-sample" class="color-sample"></div>
                </div>
            </div>
        </div>
        <div id="loading-indicator" class="hidden">
            <div class="spinner"></div>
            <span>正在处理图片...</span>
        </div>
        <div id="control-panel" class="hidden">
            <h3 class="panel-title">场景控制</h3>
            <div class="control-group">
                <label>建筑透明度</label>
                <input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="1">
                <span id="opacity-value">100%</span>
            </div>
            <div class="control-group">
                <label>地面材质</label>
                <div class="material-buttons">
                    <button class="material-btn active" data-material="asphalt">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="3" y1="15" x2="21" y2="15"/>
                        </svg>
                        沥青
                    </button>
                    <button class="material-btn" data-material="grass">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v20"/>
                            <path d="M2 12h20"/>
                            <path d="m4.93 4.93 14.14 14.14"/>
                            <path d="m19.07 4.93-14.14 14.14"/>
                        </svg>
                        草地
                    </button>
                    <button class="material-btn" data-material="water">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                            <path d="M2 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                            <path d="M2 6c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                        </svg>
                        水面
                    </button>
                </div>
            </div>
            <div class="control-group">
                <label>环境光强度</label>
                <input type="range" id="ambient-slider" min="0" max="2" step="0.1" value="0.5">
                <span id="ambient-value">50%</span>
            </div>
            <button id="reset-view-btn" class="btn-secondary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
                重置视角
            </button>
        </div>
        <div id="mobile-accordion" class="hidden">
            <button class="accordion-header">
                <span>控制面板</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>
            <div class="accordion-content">
                <div class="control-group">
                    <label>建筑透明度</label>
                    <input type="range" id="mobile-opacity-slider" min="0" max="1" step="0.1" value="1">
                </div>
                <div class="control-group">
                    <label>环境光强度</label>
                    <input type="range" id="mobile-ambient-slider" min="0" max="2" step="0.1" value="0.5">
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
