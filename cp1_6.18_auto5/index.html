<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据清洗报告工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7FAFC;
      --surface: #FFFFFF;
      --surface-alt: #EDF2F7;
      --border: #E2E8F0;
      --text-primary: #1A202C;
      --text-secondary: #4A5568;
      --text-muted: #718096;
      --accent: #2B6CB0;
      --accent-light: #3182CE;
      --accent-dark: #2C5282;
      --success: #38A169;
      --warning: #D69E2E;
      --danger: #E53E3E;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07), 0 2px 4px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1), 0 4px 10px rgba(0, 0, 0, 0.04);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .summary-bar {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .summary-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .summary-value {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px;
    }

    .upload-section {
      margin-bottom: 32px;
    }

    .upload-zone {
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 60px 32px;
      text-align: center;
      transition: all 0.25s var(--ease-out);
      cursor: pointer;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent);
      background: #EBF4FF;
      transform: translateY(-2px);
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: var(--surface-alt);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      transition: all 0.25s var(--ease-out);
    }

    .upload-zone:hover .upload-icon {
      background: var(--accent);
      color: white;
    }

    .upload-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .upload-hint {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s var(--ease-out);
    }

    .upload-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .upload-btn:active {
      transform: translateY(0);
    }

    #fileInput {
      display: none;
    }

    .loading-state {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .loading-state.show {
      display: block;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .report-section {
      display: none;
    }

    .report-section.show {
      display: block;
      animation: fadeInUp 0.5s var(--ease-out);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .report-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .filename-badge {
      background: var(--surface-alt);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8125rem;
      font-weight: 500;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      cursor: pointer;
      transition: all 300ms ease-out;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: #CBD5E0;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .col-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      word-break: break-word;
      margin-right: 8px;
    }

    .type-tag {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .type-number { background: #EBF8FF; color: #2B6CB0; }
    .type-date { background: #F0FFF4; color: #276749; }
    .type-text { background: #FAF5FF; color: #553C9A; }
    .type-boolean { background: #FFF5F5; color: #C53030; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.6875rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .progress-wrap {
      margin-bottom: 16px;
    }

    .progress-label-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .progress-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .progress-bar {
      height: 6px;
      background: var(--surface-alt);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s var(--ease-out);
      width: 0;
    }

    .mini-chart-wrap {
      height: 60px;
      background: var(--surface-alt);
      border-radius: var(--radius-sm);
      padding: 8px;
    }

    .mini-chart-wrap svg {
      width: 100%;
      height: 100%;
    }

    .detail-panel-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(26, 32, 44, 0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease-out);
      z-index: 100;
    }

    .detail-panel-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
      }
      to {
        transform: translateX(0);
      }
    }

    .detail-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 480px;
      max-width: 100%;
      background: var(--surface);
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.12);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 101;
      display: flex;
      flex-direction: column;
    }

    .detail-panel.show {
      animation: slideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      animation-fill-mode: forwards;
      transform: translateX(0);
    }

    .detail-header {
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .detail-title-group {
      flex: 1;
    }

    .detail-col-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      word-break: break-word;
    }

    .detail-type-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s var(--ease-out);
      flex-shrink: 0;
    }

    .close-btn:hover {
      background: var(--surface-alt);
      color: var(--text-primary);
    }

    .detail-stats {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .detail-stat {
      display: flex;
      flex-direction: column;
    }

    .detail-stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .detail-stat-value {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .detail-chart-wrap {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      height: 180px;
    }

    .detail-chart-wrap svg {
      width: 100%;
      height: 100%;
    }

    .detail-section-title {
      padding: 20px 28px 12px;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .outlier-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 28px 20px;
    }

    .outlier-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }

    .outlier-value {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 0.8125rem;
      color: var(--text-primary);
      word-break: break-all;
      flex: 1;
      margin-right: 12px;
    }

    .outlier-row-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .detail-footer {
      padding: 20px 28px;
      border-top: 1px solid var(--border);
    }

    .filter-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s var(--ease-out);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .filter-btn:hover {
      background: var(--accent-dark);
      box-shadow: var(--shadow-md);
    }

    .filter-btn:active {
      transform: scale(0.99);
    }

    .filter-btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }

      main {
        padding: 20px;
      }

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .summary-bar {
        width: 100%;
        justify-content: space-between;
        gap: 16px;
      }

      .summary-item {
        align-items: flex-start;
      }

      .upload-zone {
        padding: 40px 20px;
      }

      .cards-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .detail-panel {
        width: 100%;
      }

      .report-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .card:hover {
        transform: none;
        box-shadow: var(--shadow-md);
      }

      .card:active {
        transform: scale(0.99);
      }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-mark">DQ</div>
        <span>数据清洗报告</span>
      </div>
      <div class="summary-bar" id="summaryBar" style="display: none;">
        <div class="summary-item">
          <span class="summary-label">总行数</span>
          <span class="summary-value" id="totalRows">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">总列数</span>
          <span class="summary-value" id="totalCols">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">缺失值</span>
          <span class="summary-value" id="totalMissing">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">异常值</span>
          <span class="summary-value" id="totalOutliers">0</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="upload-section" id="uploadSection">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <div class="upload-title">拖放数据文件到这里</div>
        <div class="upload-hint">支持 CSV 和 JSON 格式，最大 10MB</div>
        <button class="upload-btn" id="browseBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          选择文件
        </button>
        <input type="file" id="fileInput" accept=".csv,.json,application/json,text/csv" />
      </div>
    </section>

    <section class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <div class="loading-text">正在解析数据...</div>
    </section>

    <section class="report-section" id="reportSection">
      <div class="report-header">
        <h2 class="report-title">数据质量概览</h2>
        <span class="filename-badge" id="filenameBadge"></span>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
    </section>
  </main>

  <div class="detail-panel-overlay" id="panelOverlay"></div>
  <aside class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <div class="detail-title-group">
        <div class="detail-col-name" id="detailColName"></div>
        <div class="detail-type-row">
          <span class="type-tag" id="detailTypeTag"></span>
        </div>
      </div>
      <button class="close-btn" id="closePanel" aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="detail-stats" id="detailStats"></div>
    <div class="detail-chart-wrap" id="detailChart"></div>
    <div class="detail-section-title">异常值列表</div>
    <div class="outlier-list" id="outlierList"></div>
    <div class="detail-footer">
      <button class="filter-btn" id="filterOutliersBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
        过滤异常行
      </button>
    </div>
  </aside>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
