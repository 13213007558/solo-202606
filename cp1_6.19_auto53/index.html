<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 分子结构可视化</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #0a0e27 0%, #000000 100%); color: #e0e0e0; }
    #app { width: 100%; height: 100%; position: relative; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #canvas-container canvas { display: block; }
    .input-bar { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; z-index: 10; padding: 12px 20px; background: rgba(15, 20, 50, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(100, 150, 255, 0.2); border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
    .input-bar input { width: 240px; padding: 10px 16px; border: 1px solid rgba(100, 150, 255, 0.3); border-radius: 10px; background: rgba(10, 15, 40, 0.6); color: #e0e8ff; font-size: 15px; outline: none; transition: all 0.25s ease; }
    .input-bar input:focus { border-color: rgba(100, 150, 255, 0.8); box-shadow: 0 0 12px rgba(100, 150, 255, 0.3); }
    .input-bar input::placeholder { color: rgba(200, 200, 220, 0.4); }
    .input-bar button { padding: 10px 24px; border: none; border-radius: 10px; background: linear-gradient(135deg, #4a6fff 0%, #3a4fd0 100%); color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.25s ease; }
    .input-bar button:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(74, 111, 255, 0.4); }
    .input-bar button:active { transform: scale(0.98); }
    .control-panel { position: absolute; top: 50%; right: 24px; transform: translateY(-50%); width: 260px; padding: 20px; background: rgba(15, 20, 50, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(100, 150, 255, 0.2); border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); z-index: 10; transition: all 0.3s ease; }
    .control-panel h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #a8c0ff; letter-spacing: 0.5px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stat-item { padding: 12px; background: rgba(30, 40, 80, 0.6); border-radius: 10px; text-align: center; }
    .stat-value { font-size: 22px; font-weight: 700; color: #4a6fff; }
    .stat-label { font-size: 12px; color: rgba(200, 200, 220, 0.7); margin-top: 2px; }
    .mode-section { margin-bottom: 20px; }
    .mode-title { font-size: 13px; color: rgba(200, 200, 220, 0.8); margin-bottom: 10px; }
    .mode-buttons { display: flex; flex-direction: column; gap: 8px; }
    .mode-btn { padding: 10px 14px; border: 1px solid rgba(100, 150, 255, 0.2); border-radius: 10px; background: rgba(30, 40, 80, 0.4); color: #c0d0ff; font-size: 13px; cursor: pointer; transition: all 0.25s ease; text-align: left; }
    .mode-btn:hover { background: rgba(60, 80, 140, 0.6); transform: scale(1.02); }
    .mode-btn.active { background: linear-gradient(135deg, #4a6fff 0%, #3a4fd0 100%); border-color: transparent; color: white; }
    .action-buttons { display: flex; flex-direction: column; gap: 10px; }
    .action-btn { padding: 12px; border: none; border-radius: 10px; background: rgba(30, 40, 80, 0.6); color: #c0d0ff; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .action-btn:hover { background: rgba(60, 80, 140, 0.8); transform: scale(1.03); }
    .action-btn:active { transform: scale(0.98); }
    .atom-info-panel { position: absolute; padding: 14px 18px; background: rgba(15, 20, 50, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(100, 150, 255, 0.3); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); z-index: 20; pointer-events: none; opacity: 0; transform: translateY(-50%); transition: opacity 0.3s ease, transform 0.3s ease; min-width: 160px; }
    .atom-info-panel.visible { opacity: 1; transform: translateY(0); }
    .atom-info-panel .symbol { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .atom-info-line { font-size: 12px; color: rgba(200, 200, 220, 0.8); margin-top: 4px; }
    .atom-info-line span { color: #a8c0ff; font-weight: 600; }
    .error-toast { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background: rgba(200, 60, 60, 0.9); color: white; border-radius: 10px; font-size: 13px; z-index: 30; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
    .error-toast.visible { opacity: 1; }
    @media (max-width: 768px) {
      .input-bar { top: 12px; padding: 8px 12px; }
      .input-bar input { width: 160px; padding: 8px 12px; font-size: 13px; }
      .input-bar button { padding: 8px 16px; font-size: 13px; }
      .control-panel { top: auto; bottom: 0; right: 0; left: 0; transform: none; width: 100%; border-radius: 16px 16px 0 0; padding: 14px; }
      .mode-buttons { flex-direction: row; }
      .action-buttons { flex-direction: row; }
      .stats { margin-bottom: 12px; }
      .mode-section { margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>
    <div class="input-bar">
      <input type="text" id="formula-input" placeholder="输入分子式，如 H2O、C6H12O6" />
      <button id="generate-btn">生成</button>
    </div>
    <div class="control-panel" id="control-panel">
      <h3>分子信息</h3>
      <div class="stats">
        <div class="stat-item"><div class="stat-value" id="atom-count">0</div><div class="stat-label">原子数</div></div>
        <div class="stat-item"><div class="stat-value" id="bond-count">0</div><div class="stat-label">化学键</div></div>
      </div>
      <div class="mode-section">
        <div class="mode-title">显示模式</div>
        <div class="mode-buttons">
          <button class="mode-btn active" data-mode="ball-stick">球棍模型</button>
          <button class="mode-btn" data-mode="space-fill">空间填充模型</button>
          <button class="mode-btn" data-mode="wireframe">线框模型</button>
        </div>
      </div>
      <div class="action-buttons">
        <button class="action-btn" id="reset-btn">重置视角</button>
        <button class="action-btn" id="screenshot-btn">截图保存</button>
      </div>
    </div>
    <div class="atom-info-panel" id="atom-info-panel"></div>
    <div class="error-toast" id="error-toast"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
