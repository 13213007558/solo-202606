<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>协作白板</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f0f14;
      --bg-canvas: #16161d;
      --bg-panel: rgba(28, 28, 38, 0.85);
      --bg-panel-solid: #1c1c26;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #e8e8f0;
      --text-secondary: #9090a0;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --danger: #ef4444;
      --danger-hover: #f87171;
      --success: #10b981;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-canvas);
      cursor: crosshair;
    }

    #whiteboard {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }

    #toolbar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #toolbar.collapsed {
      padding: 8px;
      gap: 0;
    }

    #toolbar.collapsed .toolbar-item {
      display: none;
    }

    #toolbar.collapsed #toggle-btn {
      margin: 0;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 12px;
      border-right: 1px solid var(--border-color);
    }

    .toolbar-group:last-child {
      border-right: none;
      padding-right: 0;
    }

    .toolbar-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-picker-wrapper {
      position: relative;
    }

    #color-picker {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      background: none;
      cursor: pointer;
      padding: 2px;
      transition: all 0.2s ease-out;
    }

    #color-picker:hover {
      border-color: var(--accent);
      transform: scale(1.05);
    }

    #color-picker::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    #color-picker::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }

    .color-presets {
      display: flex;
      gap: 4px;
    }

    .color-preset {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease-out;
    }

    .color-preset:hover {
      transform: scale(1.15);
    }

    .color-preset.active {
      border-color: var(--text-primary);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .slider-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #brush-size {
      width: 120px;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    #brush-size::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: all 0.2s ease-out;
    }

    #brush-size::-webkit-slider-thumb:hover {
      background: var(--accent-hover);
      transform: scale(1.2);
    }

    .brush-preview {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brush-preview-dot {
      background: var(--accent);
      border-radius: 50%;
      transition: all 0.15s ease-out;
    }

    .tool-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s ease-out;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .tool-btn.active {
      background: var(--accent);
      color: white;
    }

    .tool-btn.active:hover {
      background: var(--accent-hover);
    }

    .tool-btn.danger:hover {
      background: var(--danger);
      color: white;
    }

    #toggle-btn {
      margin-left: auto;
    }

    #user-panel {
      position: fixed;
      top: 80px;
      left: 16px;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      min-width: 200px;
      box-shadow: var(--shadow);
      z-index: 90;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .user-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .user-panel-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    .status-dot.reconnecting {
      background: #f59e0b;
      animation: blink 1s infinite;
    }

    .status-dot.disconnected {
      background: var(--danger);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border-radius: 10px;
      transition: all 0.3s ease;
      animation: fadeInUser 0.4s ease-out;
    }

    .user-item.leaving {
      animation: fadeOutUser 0.4s ease-out forwards;
    }

    @keyframes fadeInUser {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeOutUser {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(-10px); }
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
      border: 3px solid;
      position: relative;
    }

    .user-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .notification {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-panel-solid);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 200;
      animation: notifyFade 3s ease-out forwards;
      box-shadow: var(--shadow);
    }

    @keyframes notifyFade {
      0% { opacity: 0; transform: translate(-50%, -20px); }
      10% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }

    .notification.join { border-left: 3px solid var(--success); }
    .notification.leave { border-left: 3px solid var(--danger); }

    .feedback-flash {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      z-index: 1000;
      animation: flashFade 0.3s ease-out forwards;
    }

    @keyframes flashFade {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    .toolbar-feedback {
      position: relative;
    }

    .toolbar-feedback::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: var(--accent);
      opacity: 0;
      animation: btnFlash 0.25s ease-out;
      pointer-events: none;
    }

    @keyframes btnFlash {
      0% { opacity: 0.5; }
      100% { opacity: 0; }
    }

    .btn-vibrate {
      animation: vibrate 0.15s ease-out;
    }

    @keyframes vibrate {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-2px); }
      75% { transform: translateY(2px); }
    }

    @media (max-width: 768px) {
      #toolbar {
        top: auto;
        bottom: 16px;
        left: 16px;
        right: 16px;
        transform: none;
        width: calc(100% - 32px);
        overflow-x: auto;
        padding: 8px 12px;
        gap: 12px;
        -webkit-overflow-scrolling: touch;
      }

      #toolbar::-webkit-scrollbar {
        display: none;
      }

      #user-panel {
        top: 16px;
        left: 16px;
        right: auto;
        min-width: 160px;
        padding: 10px;
      }

      .user-panel-header {
        margin-bottom: 8px;
        padding-bottom: 6px;
      }

      #brush-size {
        width: 80px;
      }

      .toolbar-group {
        padding-right: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container">
      <canvas id="whiteboard"></canvas>
    </div>

    <div id="toolbar">
      <div class="toolbar-group">
        <div class="toolbar-item color-picker-wrapper">
          <input type="color" id="color-picker" value="#6366f1" title="自定义颜色" />
        </div>
        <div class="toolbar-item color-presets" id="color-presets">
          <div class="color-preset active" style="background:#6366f1" data-color="#6366f1" title="靛蓝"></div>
          <div class="color-preset" style="background:#ef4444" data-color="#ef4444" title="红色"></div>
          <div class="color-preset" style="background:#f59e0b" data-color="#f59e0b" title="橙色"></div>
          <div class="color-preset" style="background:#10b981" data-color="#10b981" title="绿色"></div>
          <div class="color-preset" style="background:#3b82f6" data-color="#3b82f6" title="蓝色"></div>
          <div class="color-preset" style="background:#e8e8f0" data-color="#e8e8f0" title="白色"></div>
        </div>
      </div>

      <div class="toolbar-group">
        <div class="toolbar-item slider-wrapper">
          <div class="brush-preview" title="笔刷预览">
            <div class="brush-preview-dot" id="brush-preview-dot"></div>
          </div>
          <input type="range" id="brush-size" min="1" max="50" value="4" />
        </div>
      </div>

      <div class="toolbar-group">
        <button class="tool-btn active" id="pen-btn" title="画笔 (P)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
            <path d="m15 5 4 4"></path>
          </svg>
        </button>
        <button class="tool-btn" id="eraser-btn" title="橡皮擦 (E)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
            <path d="M22 21H7"></path>
            <path d="m5 11 9 9"></path>
          </svg>
        </button>
        <button class="tool-btn" id="text-btn" title="文字工具 (T)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" x2="15" y1="20" y2="20"></line>
            <line x1="12" x2="12" y1="4" y2="20"></line>
          </svg>
        </button>
        <button class="tool-btn" id="sticky-btn" title="便利贴 (S)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"></path>
            <path d="M15 3v4a2 2 0 0 0 2 2h4"></path>
          </svg>
        </button>
      </div>

      <div class="toolbar-group">
        <button class="tool-btn active" id="grid-btn" title="切换网格 (G)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
          </svg>
        </button>
        <button class="tool-btn danger" id="clear-btn" title="清除全部">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
        </button>
        <button class="tool-btn" id="toggle-btn" title="收起工具栏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <div id="user-panel">
      <div class="user-panel-header">
        <span class="user-panel-title">在线用户</span>
        <div class="connection-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">离线</span>
        </div>
      </div>
      <div class="user-list" id="user-list"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
